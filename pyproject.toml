[project]
name = "taskseed-ews"
version = "0.1.1"
description = "EWS CLI: a CLI adapter between AI agents and Exchange Web Services"
readme = "README.md"
authors = [
    { name = "HuYang", email = "huyangcommit@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "cyclopts>=4.22,<5",
    "email-validator>=2.3,<3",
    "exchangelib>=5.6,<6",
    "keyring>=25,<26",
    "pydantic>=2.12,<3",
    "requests>=2.32,<3",
    "rich>=14,<16",
    "sqlmodel>=0.0.42,<0.1",
    "structlog>=26,<27",
    "tomli-w>=1.2,<2",
    "truststore>=0.10,<1",
]

[project.scripts]
ews-cli = "ews_cli.cli:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "ews_cli"

[dependency-groups]
dev = [
    "pyright>=1.1.411,<2",
    "pytest>=9,<10",
    "pytest-cov>=7,<8",
    "ruff>=0.15,<1",
]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.14"
typeCheckingMode = "strict"

[tool.pytest.ini_options]
addopts = [
    "--strict-config",
    "--strict-markers",
    "--cov=ews_cli",
    "--cov-branch",
    "--cov-report=term-missing",
    "--cov-fail-under=90",
]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]
